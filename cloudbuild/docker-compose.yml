version: '3'
services:
  localstack:
    image: floci/floci:2.0.1-compat
    ports:
      - "4566:4566"
    environment:
      - FLOCI_BASE_URL=http://localstack:4566
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    network_mode: cloudbuild
    container_name: localstack
networks:
  default:
    external:
      name: cloudbuild
