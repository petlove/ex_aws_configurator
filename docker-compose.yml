version: '3.7'

services:
  localstack:
    container_name: ex_aws_configurator_localstack
    image: floci/floci:2.0.1-compat
    ports:
      - "4566:4566"
    environment:
      - FLOCI_BASE_URL=http://localstack:4566
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  lib:
    container_name: ex_aws_configurator_lib
    depends_on:
      - localstack
    volumes:
      - .:/app
    build:
      context: .
      target: dev
    command: tail -f /dev/null

  test:
    container_name: ex_aws_configurator_test
    depends_on:
      - localstack
    environment:
      - EX_AWS_HOST=localstack
    build:
      context: .
      dockerfile: Dockerfile.test
